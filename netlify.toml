# Host normalization (SEO master prompt §6.1.8).
# Every canonical tag, JSON-LD "url", and the sitemap on this site already use
# the apex domain with no www. This redirect makes that the enforced default
# instead of an assumption, so www never serves duplicate content.
[[redirects]]
  from = "https://www.sartoricorporationusa.com/*"
  to = "https://sartoricorporationusa.com/:splat"
  status = 301
  force = true

# Clean URL for the credentials page (optional — the page also works at
# /licenses-insurance.html directly, which is what every on-site link uses).
[[redirects]]
  from = "/licenses-insurance"
  to = "/licenses-insurance.html"
  status = 200

# Clean URL for the blog (optional — every on-site link uses /blog/index.html
# directly, so this isn't load-bearing).
[[redirects]]
  from = "/blog"
  to = "/blog/index.html"
  status = 200

# Legacy URLs identified as returning live 404s (2026-08-20 report). These
# paths do not correspond to any page this repo has ever contained, so they
# predate this codebase — likely a prior site structure. Redirected to the
# closest current equivalent instead of left as dead links, to recover any
# residual link equity/traffic without inventing new dedicated pages for them.
[[redirects]]
  from = "/residential-painting/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/carpentry/*"
  to = "/painting/exterior.html"
  status = 301

[[redirects]]
  from = "/power-washing-services-in-orleans-ma/*"
  to = "/painting/exterior.html"
  status = 301
